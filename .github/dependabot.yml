version: 2

multi-ecosystem-groups:
    all:
        schedule:
            interval: 'weekly'
            day: 'monday'
            time: '09:00'
            timezone: 'Europe/Amsterdam'
        commit-message:
            prefix: 'chore'

updates:
    - package-ecosystem: 'npm'
      multi-ecosystem-group: 'all'
      registries: '*'
      directory: '/'
      patterns: ['*']
      versioning-strategy: lockfile-only

    - package-ecosystem: 'composer'
      multi-ecosystem-group: 'all'
      registries: '*'
      directory: '/'
      patterns: ['*']
      versioning-strategy: lockfile-only
