version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      groups:
          actions:
              patterns:
                  - '*'
      commit-message:
          prefix: 'chore'
      cooldown:
        default-days: 7

    - package-ecosystem: 'npm'
      directory: '/'
      registries: '*'
      schedule:
          interval: 'weekly'
          day: 'monday'
      groups:
          pnpm:
              patterns:
                  - '*'
      commit-message:
          prefix: 'chore'
      versioning-strategy: lockfile-only
      cooldown:
        default-days: 7

    - package-ecosystem: 'composer'
      registries: '*'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      groups:
          composer:
              patterns:
                  - '*'
      commit-message:
          prefix: 'chore'
      versioning-strategy: lockfile-only
      cooldown:
        default-days: 7

registries:
    ypackagist:
        type: composer-repository
        url: https://packagist.yard.nl/satispress/
        username: ${{secrets.YPACKAGIST_API_KEY}}
        password: ${{secrets.YPACKAGIST_PASSWORD}}

    github:
        type: npm-registry
        url: https://npm.pkg.github.com
        token: ${{secrets.YARD_BOT_PAT}}
