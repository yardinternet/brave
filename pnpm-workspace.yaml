publicHoistPattern:
  - prettier
  - stylelint
  - eslint
  - stylelint-config-recommended
  - stylelint-config-idiomatic-order
  - '@babel/preset-react'

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
